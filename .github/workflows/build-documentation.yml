name: Build Documentation

on:
  push:
    branches: [main]

  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Triggered by the Npgsql and EFCore.PG repos when their docs change
  repository_dispatch:
    types: [docs-changed]

  # Nightly rebuild to pick up API changes
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: pages-${{ github.ref }}
  # Don't cancel in-progress deployments; pending runs are still superseded by the latest one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Build source snapshots for API docs, not dependency auditing.
      NuGetAudit: "false"

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Checkout Npgsql
      uses: actions/checkout@v7
      with:
        repository: npgsql/npgsql
        ref: main
        path: Npgsql

    - name: Checkout EFCore.PG
      uses: actions/checkout@v7
      with:
        repository: npgsql/efcore.pg
        ref: main
        path: EFCore.PG

    - name: Use Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version: 20.x

    - name: Run Markdownlint
      run: |
        echo "::add-matcher::.github/workflows/markdownlint-problem-matcher.json"
        npm i -g markdownlint-cli
        markdownlint "conceptual/**/*.md"

    # Setup software
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6.1.0
      with:
        dotnet-version: |
          10.0.x
          11.0.x

    # docfx has issues specifically with analyzer/sourcegen projects; build manually before.
    - name: Build Npgsql
      run: dotnet build -c Release
      shell: bash
      working-directory: Npgsql

    - name: Build EFCore.PG
      run: dotnet build -c Release
      shell: bash
      working-directory: EFCore.PG

    - name: Get docfx
      run: dotnet tool install --version 2.81.0 -g docfx

    - name: Build docs
      run: docfx --warningsAsErrors

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
